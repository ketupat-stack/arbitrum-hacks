[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.28"
via_ir = false

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
anvil            = "http://127.0.0.1:8545"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
arbitrum_one     = "${ARBITRUM_ONE_RPC_URL}"

[etherscan]
# Arbiscan API key used for --verify on Arbitrum Sepolia (chain id 421614)
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api", chain = 421614 }
# Arbiscan API key used for --verify on Arbitrum One (chain id 42161)
arbitrum_one     = { key = "${ARBISCAN_API_KEY}", url = "https://api.arbiscan.io/api", chain = 42161 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
